<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TPCoach</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone-width column, a "score card" per student — level track, next lesson, 10-ball test rows */
:root{
  /* TPC palette: deep navy #0c2430 + gold #eaca7e */
  --bg:#0c2430; --surface:#12303f; --ink:#f1ead8; --muted:#9fb0b8; --line:#24434f;
  --court:#eaca7e; --ball:#eaca7e; --ball-ink:#0c2430; --miss:#1d3a48; --warn:#f08a74;
  color-scheme:dark;
  --display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c2430; --surface:#12303f; --ink:#f1ead8; --muted:#9fb0b8; --line:#24434f;
  --court:#eaca7e; --ball:#eaca7e; --ball-ink:#0c2430; --miss:#1d3a48; --warn:#f08a74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c2430; --surface:#12303f; --ink:#f1ead8; --muted:#9fb0b8; --line:#24434f;
  --court:#eaca7e; --ball:#eaca7e; --ball-ink:#0c2430; --miss:#1d3a48; --warn:#f08a74; color-scheme:dark}
.head{border-bottom:2px solid var(--ball);padding-bottom:10px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted);font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
button.primary{background:var(--court);border-color:var(--court);color:var(--surface);font-weight:700}
button.danger{color:var(--warn)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--court);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;width:100%;box-sizing:border-box;min-width:0}

/* coach bar */
.coachbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.coachbar select{flex:1 1 180px;width:auto}
.tag{font-size:12px;font-weight:700;background:var(--ball);color:var(--ball-ink);border-radius:999px;padding:2px 10px}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:26px}

/* level track */
.level{display:flex;align-items:baseline;gap:10px}
.level .num{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--court);font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;background:var(--miss);border-radius:999px;margin-top:8px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--court);border-radius:999px}
.track .dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ball);border:3px solid var(--court);box-sizing:border-box}
.ticks{display:flex;justify-content:space-between;font-family:var(--display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}

/* skills */
.skills{display:flex;flex-direction:column;gap:12px}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.sk-name{font-weight:700}
.sk-rate{font-family:var(--display);font-size:22px;font-weight:700;color:var(--court);font-variant-numeric:tabular-nums}
.sk-bar{grid-column:1/-1;height:8px;background:var(--miss);border-radius:999px;overflow:hidden}
.sk-bar div{height:100%;background:var(--court);border-radius:999px}
.sk-note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.fix{border-color:var(--warn);color:var(--warn)}

.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ov{display:flex;flex-direction:column;align-items:flex-end}
.ov-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.ov-num{font-family:var(--display);font-size:48px;font-weight:700;line-height:1;color:var(--court);font-variant-numeric:tabular-nums}
.ov-num small{font-size:22px}
.radar-wrap{margin:0 -8px}
.ov-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ov-sum>div{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.ov-sum b.warn{color:var(--warn)}
.sk-notes{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.sk-notes b{color:var(--ink)}
.jump{margin-top:8px;font-size:13px;padding:4px 12px}
.coach-ed{border:2px solid var(--court)}
.cv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cv-sel{display:flex;align-items:center;gap:6px;font-size:13px}
.cv-sel select{width:auto}
.cv-stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cv-num{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--court);font-variant-numeric:tabular-nums}
.cv-delta{margin:0;font-weight:700;color:var(--court)}
.cv-delta.down{color:var(--warn)}
.cv-wrap{margin:0 -6px}
.acct{display:flex;flex-direction:column;gap:2px;font-size:13px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.acct .muted{font-size:12px}
.bindbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.warn-t{color:var(--warn)}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codebox code{flex:1 1 220px;min-width:0;overflow-wrap:anywhere;font-size:15px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px dashed var(--ball);user-select:all}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px}
.hit img{width:28px;height:28px;border-radius:50%;flex:none}
.hit span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.hit small{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.msgbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.msg-form{display:flex;flex-direction:column;gap:8px}
.msg-form select{width:auto;align-self:flex-start}
.msg-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.msg-item{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.msg-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.msg-meta .muted{font-size:12px}
.mtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--ball);color:var(--ball-ink)}
.mtag-q{background:var(--court);color:var(--surface)}
.mtag-note{background:var(--miss);color:var(--ink)}
.msg-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-reply{border-left:3px solid var(--ball);padding-left:10px;font-size:14px}
.msg-reply p{margin:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-reply .muted{font-size:12px}
.linebox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px dashed var(--ball);border-radius:10px;font-size:14px}
.linebtn{display:inline-block;background:#06c755;color:#fff;font-weight:700;border-radius:8px;padding:6px 14px;text-decoration:none}
.rk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rk-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.rk-col h3{margin:0;font-size:14px}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rk li{display:grid;grid-template-columns:24px 1fr auto;grid-template-areas:"no name ov" "no n n";align-items:center;gap:0 8px;padding:6px 8px;border-radius:8px}
.rk li.rk-top{background:var(--bg);box-shadow:inset 3px 0 0 var(--ball)}
.rk-no{grid-area:no;font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rk-top .rk-no{color:var(--court)}
.rk-nm{grid-area:name;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.rk-name{border:0;background:none;padding:0;text-align:left;font-weight:700;min-width:0;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rk-badge{font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;background:var(--ball);color:var(--ball-ink)}
.rk-ov{grid-area:ov;font-family:var(--display);font-size:20px;font-weight:700;color:var(--court);font-variant-numeric:tabular-nums}
.rk-n{grid-area:n;font-size:12px}
.rk-sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.acct-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acct-row button{font-size:12px;padding:3px 10px}
.login{align-items:flex-start;padding-block:28px}
.login h1{font-size:22px}
.gbtn{font-size:16px;padding:10px 18px}
.sum-sub{font-weight:400;font-size:13px;margin-left:6px}
.legend{border-top:1px solid var(--line);padding-top:10px}
.legend summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--court)}
.legend dl{margin:10px 0 6px;display:flex;flex-direction:column;gap:8px}
.legend dl>div{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline}
.legend dt{font-family:var(--display);font-size:20px;font-weight:700;color:var(--court);font-variant-numeric:tabular-nums}
.legend dd{margin:0;font-size:13px;min-width:0}
.fixbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warn);cursor:pointer;align-self:end;padding-bottom:6px}
.fixbox input{width:18px;height:18px;flex:none;accent-color:var(--warn)}

/* language switch */
.langbar{display:flex;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;border-radius:999px;padding:4px 12px;font-size:13px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--court);color:var(--surface);font-weight:700}
:lang(ja) body,:lang(ja) input,:lang(ja) textarea,:lang(ja) select,:lang(ja) button{font-family:"Noto Sans JP",var(--body)}

/* next lesson */
.goal{font-size:18px;font-weight:700}
.prep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prep label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.prep input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--court)}

/* test rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .item{font-weight:700;min-width:0}
.row .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.balls{grid-column:1/-1;display:grid;grid-template-columns:44px 1fr auto;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--miss)}
.dots i.on{background:var(--ball);box-shadow:inset 0 0 0 2px var(--court)}
.score{font-family:var(--display);font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.delta{font-family:var(--display);font-weight:700;color:var(--court)}
.note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.row .del{grid-column:1/-1;justify-self:start;font-size:12px;padding:2px 8px}

/* editor */
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"＋ ";color:var(--court)}
details[open].card>summary::before{content:"－ "}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.msg{font-size:13px;color:var(--court)}
.empty{text-align:center;padding:32px 18px}
@media (prefers-reduced-motion:no-preference){.track .fill,.track .dot{transition:all .4s ease}}
</style>

</head>

function fmtWhen(v){if(!v)return "";const str=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(str))return str;const d=new Date(str);if(isNaN(d))return str.replace("T"," ");

function curveSvg(pts){
  const W=420,H=230,L=40,Rp=22,Tp=24,B=30,iw=W-L-Rp,ih=H-Tp-B;
  const t0=pts[0].d.getTime(),t1=pts[pts.length-1].d.getTime(),span=Math.max(1,t1-t0);
  const X=d=>pts.length===1?L+iw/2:L+iw*(d.getTime()-t0)/span, Y=v=>Tp+ih*(1-(Math.max(3,Math.min(4,v))-3));
  let g="";
  SK_LEVELS.forEach(lv=>{const y=Y(lv);g+=`<line x1="${L}" y1="${y}" x2="${W-Rp}" y2="${y}" stroke="var(--line)" stroke-width="1" ${lv%0.5===0?"":'stroke-dasharray="3 3"'}/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmtSk(lv)}</text>`});
  const xy=pts.map(p=>[X(p.d),Y(p.v)]);
  if(xy.length>1){g+=`<polygon points="${xy[0][0]},${Y(3)} ${xy.map(q=>q.join(",")).join(" ")} ${xy[xy.length-1][0]},${Y(3)}" fill="var(--court)" fill-opacity=".12"/>`;
    g+=`<polyline points="${xy.map(q=>q.join(",")).join(" ")}" fill="none" stroke="var(--court)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`}
  const showAll=pts.length<=5;
  pts.forEach((p,i)=>{const [x,y]=xy[i],last=i===pts.length-1;
    g+=`<circle cx="${x}" cy="${y}" r="${last?6:4}" fill="${last?"var(--ball)":"var(--surface)"}" stroke="var(--court)" stroke-width="2"/>`;
    if(showAll||i===0||last){const anc=pts.length===1?"middle":(i===0?"start":(last?"end":"middle"));
      g+=`<text x="${x}" y="${H-10}" text-anchor="${anc}" font-size="13" fill="var(--muted)">${fmtDay(p.d)}</text>`;
      g+=`<text x="${x}" y="${y-11}" text-anchor="${anc}" font-size="14" font-weight="700" fill="var(--ink)">${p.v.toFixed(2)}</text>`}});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T.curve}" style="width:100%;height:auto;display:block;font-family:inherit">${g}</svg>`;
}
function curveCard(s){

  const pts=ev.map(e=>({d:new Date(e.t),v:curveKey==="overall"?num(e.overall,NaN):num((e.levels||{})[curveKey],NaN)})).filter(p=>isFinite(p.v)&&!isNaN(p.d));
  const opts=`<option value="overall" ${curveKey==="overall"?"selected":""}>${T.overall}</option>`+SKILL_KEYS.map(k=>`<option value="${k}" ${curveKey===k?"selected":""}>${T.skills[k]}</option>`).join("");
  let body;

  else{const first=pts[0],last=pts[pts.length-1],d=last.v-first.v;
    body=`<div class="cv-stat"><span class="cv-num">${last.v.toFixed(2)}</span><span class="muted">${T.latest} · ${fmtWhen(ev[ev.length-1].t)}</span></div>
    ${pts.length>1?`<p class="cv-delta ${d<0?"down":""}">${T.sinceFirst(`${d>=0?"+":""}${d.toFixed(2)}`,fmtDay(first.d))}</p>`:""}
    <div class="cv-wrap">${curveSvg(pts)}</div>

function radar(sk){
  const W=470,H=400,cx=235,cy=200,R=104,n=SKILL_KEYS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  let g="";
  const rr=lv=>R*(lv-SK_MIN)/(SK_MAX-SK_MIN);
  SK_LEVELS.forEach(lv=>{g+=`<polygon points="${SKILL_KEYS.map((_,i)=>pt(i,rr(lv)).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="${lv%0.5===0?1.2:0.6}" ${lv%0.5===0?"":'stroke-dasharray="3 3"'}/>`});
  SKILL_KEYS.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`});
  [3.0,3.5,4.0].forEach(lv=>{g+=`<text x="${cx+4}" y="${cy-rr(lv)+12}" font-size="10" fill="var(--muted)">${lv.toFixed(1)}</text>`});
  const vals=SKILL_KEYS.map(k=>skillVal(sk[k])??SK_MIN);
  g+=`<polygon points="${vals.map((v,i)=>pt(i,rr(v)).join(",")).join(" ")}" fill="var(--court)" fill-opacity=".22" stroke="var(--court)" stroke-width="2" stroke-linejoin="round"/>`;
  SKILL_KEYS.forEach((k,i)=>{
    const v=sk[k]||{},val=skillVal(v),fix=isFix(v);
    if(val!==null){const [x,y]=pt(i,rr(val));g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${fix?"var(--warn)":"var(--ball)"}" stroke="${fix?"var(--warn)":"var(--court)"}" stroke-width="2"/>`}
    const [lx,ly]=pt(i,R+20),c=Math.cos(ang(i)),anchor=Math.abs(c)<.2?"middle":(c>0?"start":"end");
    const sn=Math.sin(ang(i)),dy=sn<-.5?-10:(sn>.5?10:0);
    const sub=fix?(val!==null?`${T.needFix} ${fmtSk(val)}`:T.needFix):(val!==null?fmtSk(val):T.notRated);
    g+=`<text x="${lx}" y="${ly+dy}" text-anchor="${anchor}" font-size="15" font-weight="700" fill="var(--ink)">${T.skills[k]}</text>
        <text x="${lx}" y="${ly+dy+17}" text-anchor="${anchor}" font-size="14" font-weight="700" fill="${fix?"var(--warn)":(val!==null?"var(--court)":"var(--muted)")}">${sub}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T.radar}" style="width:100%;height:auto;display:block;font-family:inherit">${g}</svg>`;
}

  const split=(list,val,sub)=>{const m=list.filter(r=>r.g==="m"),f=list.filter(r=>r.g==="f"),u=list.filter(r=>r.g!=="m"&&r.g!=="f");
    return `<div class="rk-grid">${group(T.male,m,false,val,sub)}${group(T.female,f,false,val,sub)}</div>${u.length?group(T.unsetG,u,true,val,sub):""}`};
  const ovVal=r=>r.ov.toFixed(2),ovSub=r=>T.evalsN(Math.max(r.n,1));
  const gVal=r=>`${r.gain>=0?"+":""}${r.gain.toFixed(2)}`,gSub=r=>`${fmtDay(r.from)} → ${fmtDay(r.to)} · ${T.weeks(Math.round(r.days/7))}`;
  return `<details class="card" id="rank" ${open?"open":""}><summary>${T.rankTitle}</summary>
    <p class="muted" style="margin:0">${T.rankHint}</p>
    <section class="rk-sec"><h2>${T.rkOverall}</h2><p class="muted" style="margin:0;font-size:12px">${T.rkOverallHint}</p>
      ${byOv.length?split(byOv,ovVal,ovSub):`<p class="muted" style="margin:0">${T.noRanked}</p>`}</section>
    <section class="rk-sec"><h2>${T.rkGain}</h2><p class="muted" style="margin:0;font-size:12px">${T.rkGainHint}</p>
      ${byGain.length?split(byGain,gVal,gSub):`<p class="muted" style="margin:0">${T.noGain}</p>`}</section>
  </details>`;
}
function coachBar(){
  return `<div class="card"><div class="coachbar">
    <span class="tag">${T.coach}</span>
    <select id="pick" aria-label="${T.pick}"><option value="">${T.pick}</option>${students.map(s=>`<option value="${s.id}" ${s.id===currentId?"selected":""}>${esc(s.name)}${overall(s.skills||{})!==null?` (${overall(s.skills||{})})`:""}${s.email?"":` · ${T.unbound}`}</option>`).join("")}</select>
    <button id="b-new" type="button">${T.newStu}</button>
  </div><p class="muted" style="margin:0">${T.shareHint}</p></div>`;
}

function render(){
  // keep only what the user has edited but not saved, plus focus, caret and scroll
  const keep={};dirty.forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.type==="checkbox"?el.checked:el.value});
  const ae=document.activeElement,focusId=ae&&ae.id&&app.contains(ae)?ae.id:null;
  let sel=null;try{if(focusId&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  const sy=window.scrollY;
  const open={};["ed-basic","ed-rec","ed-info","ed-skill","rank"].forEach(id=>{const d=document.getElementById(id);if(d)open[id]=d.open});
  const s=students.find(x=>x.id===currentId);
  let h=accountBar();
  if(canEdit)h+=coachBar()+rankCard(!s);
  if(!canEdit&&!s){h+=me&&me.email?`<div class="card"><h2>${T.notLinked}</h2><p style="margin:0">${T.sendCode}</p>
      <div class="codebox"><code id="my-code">${esc(me.email)}</code></div></div>`
      :`<div class="card empty"><p class="muted">${T.noId}</p></div>`;app.innerHTML=h;bind();return}
  if(!s){h+=`<div class="card empty"><h1 style="font-size:20px">${T.title}</h1><p class="muted">${canEdit?(students.length?T.emptyCoach:T.emptyNone):T.emptyStu}</p></div>`;app.innerHTML=h;bind();return}
  const upd=s.updatedAt?new Date(s.updatedAt).toLocaleDateString(T.locale):"";
  h+=`<header class="head"><div><p class="muted" style="margin:0">${T.history}</p><h1>${esc(s.name)}</h1></div><span class="muted">${upd?T.updated+upd:""}</span></header>`;
  watchMsgs(s.id);
  h+=canEdit?basicCard(s)+skillsCard(s)+curveCard(s)+skillsEditor(s)+recCard(s)+rowsCard(s)+infoCard(s)+nextCard(s)
            :skillsCard(s)+curveCard(s)+nextCard(s)+rowsCard(s);
  app.innerHTML=h;
  if(open.rank!==undefined&&document.getElementById("rank"))document.getElementById("rank").open=open.rank;
  if(s.id===render.lastId)for(const id in open){const d=document.getElementById(id);if(d)d.open=open[id]}
  if(s.id===render.lastId)for(const id in keep){const el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=keep[id];else el.value=keep[id]}}
  else dirty.clear();
  render.lastId=s.id;
  bind();
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(Math.abs(window.scrollY-sy)>1)window.scrollTo(0,sy);
}

function bindMsgs(s){
  const f=document.getElementById("f-msg");if(!f)return;
  f.addEventListener("submit",ev=>{ev.preventDefault();busy(f,async()=>{const text=val("m-text").trim().slice(0,1000);if(!text)return;
    const m={type:val("m-type"),text,t:new Date().toISOString(),from:canEdit?"coach":"student"};
    try{await db.collection(`students/${s.id}/msgs`).doc().set(m);dirty.delete("m-text");dirty.delete("m-type");const ta=document.getElementById("m-text");if(ta)ta.value="";flash("m-msg",T.sent)}
    catch(e){alertBox(T.msgFail+(e&&e.message||T.retry))}})});
  if(!canEdit)return;
  document.querySelectorAll("[data-reply]").forEach(b=>b.addEventListener("click",async()=>{const id=b.dataset.reply,t=val("rp-"+id).trim();if(!t)return;
    b.disabled=true;try{await db.collection(`students/${s.id}/msgs`).doc(id).update({reply:t,replyT:new Date().toISOString()});dirty.delete("rp-"+id)}catch(e){b.disabled=false;alertBox(T.saveFail+(e&&e.message||T.retry))}}));
  document.querySelectorAll("[data-delmsg]").forEach(b=>b.addEventListener("click",async()=>{try{await db.collection(`students/${s.id}/msgs`).doc(b.dataset.delmsg).delete()}catch(e){alertBox(T.delFail)}}));
}
function flash(id,t){const el=document.getElementById(id);if(el){el.textContent=t;setTimeout(()=>{if(el)el.textContent=""},2500)}}
function alertBox(t){const d=document.createElement("div");d.className="card";d.style.color="var(--warn)";d.textContent=t;app.prepend(d);setTimeout(()=>d.remove(),4000)}
async function save(id,data){try{await db.collection("students").doc(id).update({...data,updatedAt:new Date().toISOString()});return true}catch(e){alertBox(T.saveFail+(e&&e.message||T.retry));return false}}
function val(id){return document.getElementById(id)?.value??""}

function bind(){
  const s=students.find(x=>x.id===currentId);
  document.querySelectorAll(".prep input").forEach(cb=>cb.addEventListener("change",()=>{
    saveTicks(s.id,s.nextGoal||"",[...document.querySelectorAll(".prep input")].filter(x=>x.checked).map(x=>+x.dataset.i))}));
  document.getElementById("b-signout")?.addEventListener("click",()=>{stopAll();signOut(auth)});
  document.getElementById("curve-sel")?.addEventListener("change",e=>{curveKey=e.target.value;render()});
  if(s)bindMsgs(s);
  if(!canEdit)return;
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{currentId=b.dataset.open;location.hash=currentId;render();scrollTo(0,0)}));
  const pick=document.getElementById("pick");
  pick&&pick.addEventListener("change",()=>{currentId=pick.value||null;location.hash=currentId||"";render()});
  document.getElementById("b-rate")?.addEventListener("click",()=>{const d=document.getElementById("ed-skill");if(d){d.open=true;d.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});document.getElementById("k-serve-level")?.focus({preventScroll:true})}});
  document.getElementById("b-new")?.addEventListener("click",async()=>{
    const ref=db.collection("students").doc(),id=ref.id;
    try{await ref.set({name:T.newName,email:"",nextGoal:"",prep:[],sessions:[],skills:{},evals:[],updatedAt:new Date().toISOString()});
      currentId=id;location.hash=id;setTimeout(()=>{const d=document.getElementById("ed-basic");if(d){d.open=true;d.scrollIntoView({block:"start"});document.getElementById("i-name").select()}},400)}
    catch(e){alertBox(T.addFail+(e&&e.message||""))}
  });
  if(!s)return;
  const fRec=document.getElementById("f-rec");
  fRec?.addEventListener("submit",ev=>{ev.preventDefault();busy(fRec,async()=>{
    const r={rid:Math.random().toString(36).slice(2,9),date:val("r-date"),item:val("r-item").trim(),
      before:Math.max(0,Math.min(10,parseInt(val("r-before"))||0)),after:Math.max(0,Math.min(10,parseInt(val("r-after"))||0)),note:val("r-note").trim()};
    if(await save(s.id,{sessions:[...(s.sessions||[]),r]})){["r-item","r-before","r-after","r-note"].forEach(i=>{dirty.delete(i);const el=document.getElementById(i);if(el)el.value=""});dirty.delete("r-date");flash("m-rec",T.added)}
  })});
  const fBasic=document.getElementById("f-basic");
  fBasic?.addEventListener("submit",ev=>{ev.preventDefault();busy(fBasic,async()=>{
    const em=val("i-email").trim().toLowerCase();
    if(em&&!EMAIL_RE.test(em)){flash("m-basic",T.emailBad);return}
    if(em&&students.some(x=>x.id!==s.id&&(x.email||"")===em)){flash("m-basic",T.emailUsed);return}
    const d={name:val("i-name").trim()||T.newName,email:em,gender:val("i-gender")};
    if(await save(s.id,d)){clean(fBasic);flash("m-basic",T.saved)}
  })});
  const fInfo=document.getElementById("f-info");
  fInfo?.addEventListener("submit",ev=>{ev.preventDefault();busy(fInfo,async()=>{
    const d={nextGoal:val("i-goal").trim(),prep:val("i-prep").split("\n").map(x=>x.trim()).filter(Boolean)};
    if(await save(s.id,d)){clean(fInfo);flash("m-info",T.saved)}
  })});
  const fSkill=document.getElementById("f-skill");
  fSkill?.addEventListener("submit",ev=>{ev.preventDefault();busy(fSkill,async()=>{
    const skills={};
    for(const k of SKILL_KEYS){const lv=parseFloat(val(`k-${k}-level`)),fix=!!document.getElementById(`k-${k}-fix`)?.checked,note=val(`k-${k}-note`).trim();
      if(isFinite(lv)||fix||note){const e={fix,note};if(isFinite(lv))e.level=lv;skills[k]=e}}
    const now=new Date(),ov=overall(skills),hist=(s.evals||[]).filter(x=>x&&x.t).slice();
    if(ov!==null){const pt={t:now.toISOString(),overall:+ov,levels:levelsOf(skills)};
      const last=hist[hist.length-1];if(last&&new Date(last.t).toDateString()===now.toDateString())hist[hist.length-1]=pt;else hist.push(pt)}
    if(await save(s.id,{skills,evals:hist,evaluatedAt:now.toISOString()})){clean(fSkill);flash("m-skill",T.saved)}
  })});
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>save(s.id,{sessions:(s.sessions||[]).filter(r=>r.rid!==b.dataset.del)})));
  document.getElementById("b-delstu")?.addEventListener("click",()=>{
    const z=document.getElementById("delzone");
    z.innerHTML=`<span>${T.delAsk(esc(s.name))}</span><button class="danger" id="b-yes" type="button">${T.delYes}</button><button id="b-no" type="button">${T.cancel}</button>`;
    document.getElementById("b-no").onclick=()=>render();
    document.getElementById("b-yes").onclick=async()=>{try{
      const ms=await db.collection(`students/${s.id}/msgs`).get();for(const d of ms.docs)await db.collection(`students/${s.id}/msgs`).doc(d.id).delete();
      await db.collection("students").doc(s.id).delete();currentId=null;location.hash=""}catch(e){alertBox(T.delFail)}};
  });
}

// Firestore adapter (same shape the page already uses)
const wrapDoc=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
const wrapSnap=q=>({docs:q.docs.map(d=>({id:d.id,data:()=>d.data()}))});
function makeDb(){return{collection(path){return{
  onSnapshot(cb,err){return onSnapshot(collection(fs,path),q=>cb(wrapSnap(q)),err)},
  get:async()=>wrapSnap(await getDocs(collection(fs,path))),
  doc(id){const r=id?doc(fs,path,id):doc(collection(fs,path));return{id:r.id,
    get:async()=>wrapDoc(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),
    onSnapshot(cb,err){return onSnapshot(r,d=>cb(wrapDoc(d)),err)}}}}}}}
function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];if(msgUnsub){try{msgUnsub()}catch(e){}}msgUnsub=null;msgFor=null;msgs=[];students=[];currentId=null;loaded=false;render.lastId=null}
const inLine=/\bLine\//i.test(navigator.userAgent);
function showLogin(err){
  view="login";
  const ext=location.href.split("#")[0]+(location.search?"&":"?")+"openExternalBrowser=1";
  app.innerHTML=`<div class="card login">
    <h1>${T.signInTitle}</h1><p class="muted" style="margin:0">${T.signInHint}</p>
    ${inLine?`<p class="warn-t" style="margin:0">${T.lineWarn}</p><a class="linebtn" href="${esc(ext)}">${T.openExternal}</a>`
      :`<button type="button" class="primary gbtn" id="b-signin">${T.signInBtn}</button>`}
    ${err?`<p class="warn-t" style="margin:0">${esc(err)}</p>`:""}
  </div>`;
  document.getElementById("b-signin")?.addEventListener("click",async()=>{
    const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    try{await signInWithPopup(auth,p)}
    catch(e){const c=e&&e.code||"";
      if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(auth,p)}catch(e2){showLogin(T.signInFail+(e2.code||e2.message))}}
      else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")showLogin(T.signInFail+(c||e.message))}});
}
function start(){
  view="app";
  const timer=setTimeout(()=>{if(!loaded)msg(T.timeout)},10000);
  const fail=err=>{clearTimeout(timer);msg(T.readFail(esc(err&&err.code||"error")))};
  if(canEdit){
    currentId=hashId();
    unsubs.push(db.collection("students").onSnapshot(snap=>{
      clearTimeout(timer);loaded=true;
      students=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
      render();
    },fail));
  }else{
    unsubs.push(onSnapshot(query(collection(fs,"students"),where("email","==",me.email)),q=>{
      clearTimeout(timer);loaded=true;
      students=q.docs.map(d=>({id:d.id,...d.data()}));currentId=students[0]?students[0].id:null;
      render();
    },fail));
  }
}
(()=>{
  setLang(lang);
  if(!FIREBASE_CONFIG.apiKey){view="setup";msg(T.setupNeeded);return}
  const fa=initializeApp(FIREBASE_CONFIG);auth=getAuth(fa);fs=getFirestore(fa);db=makeDb();
  getRedirectResult(auth).catch(e=>showLogin(T.signInFail+(e.code||e.message)));
  const coaches=COACH_EMAILS.map(x=>x.toLowerCase());
  onAuthStateChanged(auth,user=>{
    stopAll();
    if(!user){me=null;canEdit=false;showLogin();return}
    me={id:user.uid,name:user.displayName||"",email:(user.email||"").toLowerCase()};
    canEdit=coaches.includes(me.email);
    app.innerHTML=`<div class="card empty"><p class="muted">${T.loading}</p></div>`;
    start();
  });
  window.addEventListener("hashchange",()=>{if(!canEdit)return;currentId=hashId();if(loaded)render()});
})();
</script>
